[project]
name = "research"
version = "0.0.0"
description = "P0/P1 一次性研究原型：数据湖、封存保护、试验日志与 R1～R11 分析"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "httpx>=0.27",
    "akshare>=1.17",
    "pandas>=2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
