id: OPP-004
name: 封闭式 / 定期开放基金折价收敛
status: researching          # candidate / researching / paper / live / decaying / retired
mechanism: 规则约束（封闭期内不能赎回）
counterparty: 想提前离场的封闭期持有人，在场内折价卖出；以及需要对冲才能参与、因而要求更高折价的机构
why_institutions_absent: 无风险做法必须用 IC / IM 期货对冲，2022～2024 年贴水带来的对冲成本和折价相当；场内流通份额小
barrier: 本来就要持有权益的人不需要对冲，对冲成本为 0；需要持有 1～2 年并承受净值涨跌
crowding: 低到中。数据公开，但规模小，机构做不了
capacity_estimate: 2026-04 仍在封闭期、年化折价 ≥ 3% 的有 21 只，按单只 3 万和成交额约束合计可投约 51 万元；本机会上限 10 万
worst_case:
  - 权益仓位不对冲，绝对盯市最大回撤约 −38%（2021～2024 年创业板 / 科创板下跌）
  - 封闭期内折价继续扩大；开放时折价只收敛到约 −1%
  - 基金到期转为普通 LOF，池子缩小
decay_signals:
  - 新发封闭 / 定开权益基金持续稀少
  - 处于封闭期且折价 ≤ −3% 的基金数下降
  - 股指期货贴水收窄，机构对冲套利进入
my_cost_advantage: 不需要对冲（前提是本来就要持有这部分权益）
g0_annual_rmb: 3566          # 10 万元、θ=3%、开放后第 5 日场内卖出、盯市修正；24 个配置 3,300～5,600；2023、2024 年低于 3,000
data_sources: [akshare, 东方财富基金公告]
entry_gate: 快速否证 → G0 → G1
kill_criteria:
  - 快速否证的年净额低于 3,000 元
  - 用户不打算持有这部分权益仓位
review_log:
  - date: 2026-11-03
    note: 建卡并快速否证（188 次试验）。G0 勉强通过：平均每年超额 3,300～5,600 元，但 2023、2024 年低于 3,000；绝对盯市最大回撤 −38%。下一步等用户决定是否接受权益风险，见 docs/research/OPP004-quick-falsify.md
  - date: 2026-11-03
    note: 用户确认本来就要持有这部分权益；G1 条件提交（docs/research/OPP004-G1-criteria.md），下一步规则回测
  - date: 2026-11-03
    note: G1 不通过（样本内条件 2：84 个配置的超额回撤 5,069～14,447 元，上限 3,000 元；分红日修正后最好的配置为 −3,476 元），没有解封，经独立复核。等用户决定：停止，或者做一轮结构性修改（第 2 轮）。见 docs/research/OPP004-G1-conclusion.md
  - date: 2026-11-03
    note: 第 2 轮（板块限额 + 临近开放变体，预先登记）不通过：180 个配置中只有 5 个满足，都是尖峰、没有高原；经独立复核，没有解封。待用户决定停止或第 3 轮。见 docs/research/OPP004-round2-conclusion.md
