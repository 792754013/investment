id: OPP-006
name: 加密永续合约插针（挂单接针 / 预测插针后接针）
status: retired                # candidate / researching / paper / live / decaying / retired
mechanism: 被迫交易（强平单按市价砸盘、做市商撤单，价格瞬间偏离后回归）
counterparty: 被强平的高杠杆仓位，以及恐慌中按市价止损的人；他们按偏离的价格成交，是被迫的
why_institutions_absent: 并不缺席。做市商、同机房的低延迟交易者、交易所清算引擎都在吃这块；散户"挂单接针"也是常见玩法
barrier: 无。数据公开，任何账户都能挂限价单
exclusive_barrier: 无。用户 2026-11-03 决定破例建卡（plan.md 2.2 节第 7 问硬门槛的例外），在此如实记录
crowding: 高。对手有速度优势（亚毫秒 vs 本地 Mac 几十到几百毫秒）
capacity_estimate: 待快速否证。针底的成交量很薄，按插针那一分钟成交额的 1% 估算
worst_case:
  - 接到的不是针，而是真暴跌（价格不回来），高杠杆下直接强平
  - 多个品种同时出针（全网清算），挂单同时成交，亏损叠加
  - 交易所在极端行情下延迟、拒单或调整保证金
decay_signals:
  - 插针频率或幅度下降（交易所改进清算机制、做市深度变好）
my_cost_advantage: 无
g0_annual_rmb: 待快速否证
data_sources: [OKX 公开历史归档 1 分钟永续 K 线（本地已下载）]
entry_gate: 快速否证 → G0 → G1
quick_falsify_plan: |
  只用样本内（2026-05-01 之前），研究代码 research/analysis/r04_wick.py，结论 docs/research/OPP006-quick-falsify.md。
  1. 描述统计：1 分钟内相对前一分钟收盘偏离 ≥ X%（3/5/10%），两个方向；每年次数、收回比例、60 分钟后没收回的比例。
  2. 不预测的版本：每分钟在前收盘价下方（上方）L% 挂限价单，价格穿过挂单价 0.1% 才算成交；持有 H 分钟后按 taker 平仓。
  3. 完美预知上界：只保留"那一分钟收盘收回至少一半偏离"的成交，相当于事先知道这一分钟会出针并收回。
  4. 杠杆换算：用成交后的最低（最高）价判断 3 / 10 / 50 倍是否强平，按保证金算收益。
  成本（悲观）：开平仓都按 VIP0 taker 0.05%，平仓滑点 0.1%；有利口径（开仓按 maker 0.02%）只作敏感性。
  容量：每笔名义本金不超过 2 万 USDT，也不超过成交那一分钟成交额的 1%；汇率 1 USDT = 7.1 元。
kill_criteria:
  - 不预测的版本：悲观口径下每笔平均净收益在所有参数组合都 ≤ 0，说明不预测不可行
  - 完美预知上界：按容量算的年净额低于 3,000 元，停止，不做预测模型
  - 上界过线但只靠个别年份或个别事件（去掉贡献最大的 1 个月后低于 3,000 元），同样停止
