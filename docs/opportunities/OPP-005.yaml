id: OPP-005
name: 中小盘指数定期调样（公告后买入调入股，生效日收盘卖出）
status: researching              # candidate / researching / paper / live / decaying / retired
mechanism: 被迫交易（指数基金在生效日收盘按新样本调仓）
counterparty: 跟踪中证 500 / 中证 1000 的被动基金，必须在生效日收盘买入调入股
why_institutions_absent: 并不缺席。大资金会在公告前预测名单并提前布局（中证 500 调入股公告前 20 天已经跑赢 +1.3%），公告后剩下的空间小、一年只有 2 次
barrier: 无。名单公开，普通账户即可；门槛对你和对别人一样，你没有成本优势
crowding: 中到高。中证 500 的"公告 → 生效"一段已经明显变弱（t 1.5～2.2）；中证 1000 仍然稳定
capacity_estimate: 市场容量远大于 30 万元（调入股 20 日均成交额中位数约 1.5 亿元）；实际受 plan.md 3.3 节单机会上限（2026-11-03 起 30 万元）和每年 2 次约束；新开户只能买沪深主板（约占 58%）
worst_case:
  - 持有约 2 周，指数下跌（无法对冲），单期绝对亏损样本内最差约 −660 元 / 10 万元
  - 随机挑 10 只时个股波动大，一年可能接近 0（P10 约 70～430 元）
decay_signals:
  - 公告 → 生效的平均超额下降到成本以下（约 0.6%）
  - 公告前的提前上涨扩大
my_cost_advantage: 无（只是普通账户、手工操作、小资金冲击小）
g0_annual_rmb: 3000          # 上限 30 万、只买沪深主板、冲击每边 0.3%（0.2% 时约 4,100；全部股票约 5,200～6,200）。10 万元时约 2,000
data_sources: [中证指数公司调样公告, cnindex 调样历史（akshare）, 新浪 / 东方财富后复权日线]
entry_gate: 快速否证 → G0 → G1
kill_criteria:
  - 快速否证的年净额低于 3,000 元
  - 悲观口径下单期期望超额为负
review_log:
  - date: 2026-11-03
    note: 用户选择开始 OPP-005，进入快速否证
  - date: 2026-11-03
    note: 快速否证不通过（234 次试验）。中证 1000 调入股公告 → 生效每期毛超额 +1.7%、9 期全正、t≈6，但一年 2 次、10 万元上限，扣成本后年均约 2,000 元；中证 500、调出股反弹、国证 2000 都更差。retired，见 docs/research/OPP005-quick-falsify.md。未验证的扩展：公告前预测调入名单
  - date: 2026-11-03
    note: 用户把 plan.md 3.3 节单机会上限调到 30 万元（看到结果后修改，已如实记录）。x02 重算 36 次：只买主板约 3,000～4,100 元/年，刚好过 G0；2022、2025 年为负。重启为 researching，下一步写 G1 条件
